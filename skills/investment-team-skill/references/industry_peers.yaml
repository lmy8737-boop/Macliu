# 同行业 peer 映射 (Industry Peers Map)
#
# 用途：v6.0.3 STOCK_INQUIRY 模式下，给目标股自动取 5-6 家同业公司，
#       供 finance_collector 跑颜值评分（z-score 行业修正）和 czsc 缠论引擎对照。
#
# 维护规则：
#   - 每个一级行业取头部 5-6 家，按市值/流动性优选
#   - 如 ticker 在多个细分领域，归类按主营 >50% 收入归属
#   - peers 不需要包含目标股自己（运行时会去重）
#   - 港股代码加 ".HK"，美股加 ".US"，A 股纯数字
#
# 版本：v6.0.3-draft (2026-06-01)

# ========================== A 股 ==========================

# ---- 消费电子 / ODM ----
ODM_consumer_electronics:
  description: "智能手机/笔电/服务器 ODM 代工"
  members:
    - "603296"   # 华勤技术
    - "600745"   # 闻泰科技
    - "603341"   # 龙旗科技
    - "601138"   # 工业富联
