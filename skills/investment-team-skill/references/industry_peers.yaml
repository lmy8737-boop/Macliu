# ========================== 兜底 ==========================
# 如果 ticker 不在 ticker_to_group 里，运行时查 finance_collector 拿"申万二级"
# 再从该行业池取 top 6（或 fallback 到 generic 大盘 ETF）

fallback:
  description: "未识别 ticker 时的兜底 peers（大盘代表）"
